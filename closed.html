<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Технические работы</title>
<meta http-equiv="cache-control" content="no-cache">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;background:#0B0E1A}
body{display:flex;align-items:center;justify-content:center}
img{display:block;width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<img src="maintenance.jpg" alt="Город Хозяев. Технические работы. Город закрыт на ремонт. Скоро вернёмся.">
<script>addEventListener("load",function(){var t=window.Telegram&&Telegram.WebApp;if(t){t.ready();t.expand();try{t.setHeaderColor("#0B0E1A");t.setBackgroundColor("#0B0E1A")}catch(e){}}});</script>
<script>setInterval(function(){fetch("status.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&!d.closed)location.reload()}).catch(function(){})},20000);</script>
</body>
</html>
