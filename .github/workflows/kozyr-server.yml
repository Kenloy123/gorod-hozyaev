name: Козырь — залить сервер

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kozyr/server/**"
      - ".github/workflows/kozyr-server.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BOT: ${{ secrets.KOZYR_BOT_TOKEN }}
      REF: efdydqyslwqrefxqyhuu
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Нет секрета SUPABASE_ACCESS_TOKEN в настройках GitHub (Settings → Secrets → Actions)"; exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 1. База данных
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          sql = open("kozyr/server/1_baza.sql", encoding="utf-8").read()
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['REF']}/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={"Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"], "Content-Type": "application/json"},
              method="POST")
          try:
              print("База готова:", urllib.request.urlopen(req, timeout=60).read()[:200])
          except urllib.error.HTTPError as e:
              print("Ошибка базы:", e.code, e.read()[:500]); raise

      - name: 2. Функция api
        run: |
          supabase init --force >/dev/null 2>&1 || true
          mkdir -p supabase/functions/api
          cp kozyr/server/2_funkciya_api.ts supabase/functions/api/index.ts
          supabase functions deploy api --project-ref "$REF" --no-verify-jwt --use-api --yes

      - name: 3. Токен бота
        if: env.BOT != ''
        run: supabase secrets set TG_BOT_TOKEN="$BOT" --project-ref "$REF" --yes

      - name: 4. Подключить оплату и /start (webhook бота)
        if: env.BOT != ''
        shell: python
        run: |
          import hashlib, json, os, urllib.request
          tok = os.environ["BOT"].strip()
          secret = hashlib.sha256(("kozyr-hook:" + tok).encode()).hexdigest()[:48]
          data = json.dumps({"url": f"https://{os.environ['REF']}.supabase.co/functions/v1/api",
                             "secret_token": secret, "allowed_updates": ["message", "pre_checkout_query"],
                             "drop_pending_updates": False}).encode()
          req = urllib.request.Request(f"https://api.telegram.org/bot{tok}/setWebhook", data=data,
                                       headers={"Content-Type": "application/json"}, method="POST")
          r = json.loads(urllib.request.urlopen(req, timeout=30).read())
          print("setWebhook:", r.get("ok"), r.get("description"))
          if not r.get("ok"): raise SystemExit(1)

      - name: Итог
        run: echo "Сервер Козыря залит ✅"
